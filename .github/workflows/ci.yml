name: 🚀 Spring Boot CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "src/**"
      - "pom.xml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "src/**"
      - "pom.xml"

# Cancel redundant runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 🧩 Load all environment variables from secrets
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: ☕ Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: ⚡ Pre-download dependencies
        run: mvn -B dependency:go-offline

      - name: 🧱 Build with Maven (parallel, skip tests)
        run: mvn -B -T 1C clean verify -DskipTests --file pom.xml

      - name: 📦 Upload built JAR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-app
          path: target/*.jar

      - name: 🔗 Update dependency graph
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: advanced-security/maven-dependency-submission-action@v5