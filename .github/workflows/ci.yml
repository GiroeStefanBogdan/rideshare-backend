name: 🚀 Spring Boot CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 🧩 Environment variables from secrets
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT:  ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rideshare

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}          # use default user for container
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}      # use default password for container
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: ⏳ Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10

      - name: 🗄️ Create rideshare database
        run: |
          export PGPASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          psql -h localhost -U ${{ secrets.SPRING_DATASOURCE_USERNAME }} -tc "SELECT 1 FROM pg_database WHERE datname = 'rideshare'" | grep -q 1 || \
          psql -h localhost -U ${{ secrets.SPRING_DATASOURCE_USERNAME }} -c 'CREATE DATABASE rideshare;'


      - name: 🧱 Build & Analyze with Maven - Checkstyle (validate), SpotBugs (compile), and tests (test)
        run: mvn -B clean verify --file pom.xml

      - name: 📊 Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            target/spotbugsXml.xml
            target/spotbugs.html

      - name: 📦 Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar

      - name: 🔗 Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
