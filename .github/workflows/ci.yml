name: 🚀 Spring Boot CI Pipeline

on:
  push:
    branches: [ "**" ]          # Run on push to ANY branch
  pull_request:
    branches: [ "develop" ]     # Run on PRs targeting 'develop'

jobs:
  build:
    runs-on: ubuntu-latest
    # 🧩 Environment variables (loaded from GitHub Secrets)
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      # JDBC URL Spring Boot will use
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rideshare

    # 🐘 PostgreSQL service container
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        # Wait for the DB to be ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Step 1: Checkout repository
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 (Temurin)
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: ⏳ Wait for PostgreSQL to initialize
        run: sleep 10

      # Step 3: Build, analyze & test
      # Runs Checkstyle (validate), SpotBugs (compile), and tests (test)
      - name: 🧱 Build & Analyze with Maven - Checkstyle (validate), SpotBugs (compile), and tests (test)
        run: mvn -B clean verify --file pom.xml

      # Step 4: Upload SpotBugs report (optional but useful)
      - name: 📊 Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            target/spotbugsXml.xml
            target/spotbugs.html

      # Step 5: Upload built JAR artifact
      - name: 📦 Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar

      # Step 6: Update dependency graph for Dependabot
      - name: 🔗 Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
