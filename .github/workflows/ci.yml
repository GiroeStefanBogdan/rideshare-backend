name: 🚀 Spring Boot CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 🧩 Load all environment variables from secrets
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT}}/${{ secrets.DB_NAME }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: ☕ Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: 🧱 Build & Analyze with Maven
        run: mvn -B clean verify --file pom.xml

      - name: 📊 Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-reports
          path: |
            target/spotbugsXml.xml
            target/spotbugs.html

      - name: 📦 Upload built JAR
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-app
          path: target/*.jar

      - name: 🔗 Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5