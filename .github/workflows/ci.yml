name: 🚀 Spring Boot CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 🧩 Load all environment variables from secrets
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT}}/${{ secrets.DB_NAME }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: ⏳ Wait for PostgreSQL
        run: |
          readonly MAX_RETRIES=30
          i=0
          until PGPASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" pg_isready -h localhost -p 5432 -U "${{ secrets.SPRING_DATASOURCE_USERNAME }}" ; do
            i=$((i+1))
            if [ $i -ge $MAX_RETRIES ]; then
              echo "❌ PostgreSQL did not become ready after ${MAX_RETRIES} attempts"
              exit 1
            fi
            echo "⏳ Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"
        shell: bash

      - name: 🗄️ Create database
        run: |
          export PGPASSWORD=$SPRING_DATASOURCE_PASSWORD
          psql -h localhost -U $SPRING_DATASOURCE_USERNAME -d postgres -c "CREATE DATABASE $DB_NAME;"
        env:
          PGPASSWORD: my_password

      - name: 🧱 Build & Analyze with Maven
        run: mvn -B clean verify --file pom.xml

      - name: 📊 Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: | 
            target/spotbugsXml.xml
            target/spotbugs.html

      - name: 📦 Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar

      - name: 🔗 Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4