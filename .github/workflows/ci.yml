name: 🚀 Spring Boot CI Pipeline

on:
  push:
    branches: [ "**" ]          # Run on push to ANY branch
  pull_request:
    branches: [ "develop" ]     # Run on PRs targeting 'develop'

jobs:
  build:
    runs-on: ubuntu-latest

    # 🧩 Environment variables (loaded from GitHub Secrets)
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rideshare

    # 🐘 PostgreSQL service container
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout repository
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 (Temurin)
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Step 3: Wait for PostgreSQL to initialize
      - name: ⏳ Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10

      # Step 4: ✅ Create rideshare database (just in case)
      - name: 🗄️ Create rideshare database
        run: |
          export PGPASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          psql -h localhost -U ${{ secrets.SPRING_DATASOURCE_USERNAME }} -c 'CREATE DATABASE rideshare;'

      # Step 5: Build, analyze & test
      - name: 🧱 Build & Analyze with Maven - Checkstyle (validate), SpotBugs (compile), and tests (test)
        run: mvn -B clean verify --file pom.xml

      # Step 6: Upload SpotBugs report
      - name: 📊 Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            target/spotbugsXml.xml
            target/spotbugs.html

      # Step 7: Upload built JAR artifact
      - name: 📦 Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar

      # Step 8: Update dependency graph for Dependabot
      - name: 🔗 Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
